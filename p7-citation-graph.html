<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Citation Graph | Robot Learning Survey 2026</title>
<link rel="stylesheet" href="shared.css">
<style>
h2{border-bottom-color:#8b5cf6}
.graph-wrap{position:relative;width:100%;height:calc(100vh - 160px);min-height:600px;background:#faf9f6;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border)}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
.graph-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.topic-pill{border:none;padding:5px 14px;border-radius:99px;font-size:0.75rem;font-weight:600;font-family:var(--font-mono);cursor:pointer;transition:all .2s;opacity:0.55;background:#e7e5e4;color:#57534e}
.topic-pill:hover,.topic-pill.active{opacity:1}
.topic-pill[data-t="all"]{background:#57534e;color:#fafaf9}
.topic-pill[data-t="vla"]{background:#3b5bdb;color:#fff}
.topic-pill[data-t="wam"]{background:#7c3aed;color:#fff}
.topic-pill[data-t="rl"]{background:#e11d48;color:#fff}
.topic-pill[data-t="diff"]{background:#0891b2;color:#fff}
.topic-pill[data-t="hybrid"]{background:#d97706;color:#fff}
.topic-pill[data-t="unitree"]{background:#059669;color:#fff}
.topic-pill[data-t="ref"]{background:#9ca3af;color:#fff}
.search-box{margin-left:auto;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:0.78rem;font-family:var(--font-mono);width:180px}
.search-box:focus{outline:none;border-color:#7c3aed}
#tooltip{position:absolute;pointer-events:none;background:rgba(255,255,255,0.96);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:0.78rem;max-width:320px;display:none;z-index:10;box-shadow:var(--shadow)}
#tooltip .tt-title{font-family:var(--font-display);font-weight:700;font-size:0.88rem;margin-bottom:4px}
#tooltip .tt-authors{color:var(--text-secondary);font-size:0.72rem;margin-bottom:2px}
#tooltip .tt-meta{color:#78716c;font-size:0.68rem;font-family:var(--font-mono)}
#detail{position:absolute;right:0;top:0;width:360px;height:100%;background:rgba(255,255,255,0.97);border-left:1px solid var(--border);padding:24px 20px;overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.22,1,.36,1);z-index:20;color:var(--text)}
#detail.open{transform:translateX(0)}
#detail .close-btn{position:absolute;top:12px;right:12px;background:none;border:none;color:#78716c;font-size:1.2rem;cursor:pointer}
#detail .close-btn:hover{color:var(--text)}
#detail .d-badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:0.68rem;font-weight:600;font-family:var(--font-mono);margin-bottom:8px}
#detail .d-title{font-family:var(--font-display);font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:8px;line-height:1.4}
#detail .d-authors{font-size:0.78rem;color:var(--text-secondary);margin-bottom:4px}
#detail .d-inst{font-size:0.72rem;color:#78716c;margin-bottom:10px}
#detail .d-desc{font-size:0.82rem;line-height:1.6;margin-bottom:12px;color:var(--text-secondary)}
#detail .d-connections{margin-top:12px}
#detail .d-connections h4{font-size:0.78rem;color:#78716c;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;font-family:var(--font-mono)}
#detail .d-conn-item{font-size:0.78rem;padding:4px 0;color:var(--text-secondary);cursor:pointer;transition:color .2s}
#detail .d-conn-item:hover{color:var(--text)}
#detail .d-link{display:inline-block;margin-top:12px;padding:6px 16px;border-radius:6px;background:var(--bg);color:#7c3aed;font-size:0.78rem;font-family:var(--font-mono);font-weight:600;border:1px solid var(--border);transition:all .2s}
#detail .d-link:hover{background:#e7e5e4;color:#6d28d9}
.legend{position:absolute;bottom:12px;left:12px;display:flex;gap:10px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;font-size:0.65rem;color:var(--text-secondary);font-family:var(--font-mono)}
.legend-dot{width:8px;height:8px;border-radius:50%}
</style>
</head>
<body>
<nav id="main-nav"></nav>

<div class="container">
<h1 style="font-size:1.8rem;margin-bottom:0.3rem">Citation Graph</h1>
<p style="color:var(--text-secondary);margin-bottom:1.5rem">论文引用关系力导向图 — 点击节点查看详情，拖拽调整布局</p>

<div class="graph-toolbar">
  <button class="topic-pill active" data-t="all">All</button>
  <button class="topic-pill" data-t="vla">VLA</button>
  <button class="topic-pill" data-t="wam">WAM</button>
  <button class="topic-pill" data-t="rl">RL</button>
  <button class="topic-pill" data-t="diff">Diffusion</button>
  <button class="topic-pill" data-t="hybrid">Hybrid</button>
  <button class="topic-pill" data-t="unitree">Unitree</button>
  <button class="topic-pill" data-t="foundation" style="background:#57534e;color:#fafaf9;border:1px dashed #a8a29e">Foundation</button>
  <input class="search-box" placeholder="搜索论文..." id="searchInput">
</div>

<div class="graph-wrap" id="graphWrap">
  <canvas id="graphCanvas"></canvas>
  <div id="tooltip"></div>
  <div id="detail">
    <button class="close-btn" onclick="closeDetail()">&times;</button>
    <div id="detailContent"></div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#3b5bdb"></div>VLA</div>
    <div class="legend-item"><div class="legend-dot" style="background:#7c3aed"></div>WAM</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e11d48"></div>RL</div>
    <div class="legend-item"><div class="legend-dot" style="background:#0891b2"></div>Diffusion</div>
    <div class="legend-item"><div class="legend-dot" style="background:#d97706"></div>Hybrid</div>
    <div class="legend-item"><div class="legend-dot" style="background:#059669"></div>Unitree</div>
    <div class="legend-item"><div class="legend-dot" style="border:2px dashed #78716c;background:transparent"></div>低引用 (虚线)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#78716c"></div>高引用 (实心大)</div>
  </div>
</div>
</div>

<footer>Robot Learning Survey 2026 &mdash; Citation Graph</footer>

<script src="papers.js"></script>
<script id="paperData">
const TC={vla:'#3b5bdb',wam:'#7c3aed',rl:'#e11d48',diff:'#0891b2',hybrid:'#d97706',unitree:'#059669'};
const TN={vla:'VLA',wam:'WAM',rl:'RL Sim2Real',diff:'Diffusion',hybrid:'Hybrid',unitree:'Unitree'};
/* ── Load data from papers.json (file:// compatible) ── */
async function loadPaperData(){
  let data;
  if(window.SURVEY_DATA){data=window.SURVEY_DATA;}
  else{try{const r=await fetch('papers.json');data=await r.json();}catch(e){const x=new XMLHttpRequest();x.open('GET','papers.json',false);x.send();data=JSON.parse(x.responseText);}}
  const P=data.papers.map(p=>({
    id:p.id,
    s:p.shortTitle||p.title,
    t:p.topic||'unknown',
    a:p.authors||'',
    o:p.institution||'',
    y:typeof p.year==='number'?p.year:parseInt(p.year)||0,
    d:p.description||'',
    f:p.foundation?1:0,
    l:(p.url||'').replace('https://arxiv.org/abs/','')
  }));
  const E=data.citations.map(c=>[c.source,c.target]);
  return {P,E};
}
</script>
<script id="graphEngine">
loadPaperData().then(({P,E})=>{
const cv=document.getElementById('graphCanvas'),
      wrap=document.getElementById('graphWrap'),
      tip=document.getElementById('tooltip'),
      det=document.getElementById('detail'),
      detC=document.getElementById('detailContent');
const ctx=cv.getContext('2d');
let W,H,dpr,nodes=[],edges=[],selNode=null,hovNode=null,dragNode=null,filterT='all',searchQ='';
let camX=0,camY=0,camZ=1;
let alpha=1.0;
let settled=false; // true after pre-simulation

function resize(){
  const r=wrap.getBoundingClientRect();
  dpr=window.devicePixelRatio||1;
  W=r.width;H=r.height;
  cv.width=W*dpr;cv.height=H*dpr;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);

/* ── Topic cluster centers (normalized 0-1, mapped to canvas later) ── */
const clusterPos={
  vla:  {x:0.18, y:0.22},
  wam:  {x:0.78, y:0.22},
  rl:   {x:0.18, y:0.78},
  diff: {x:0.78, y:0.78},
  hybrid:{x:0.48, y:0.50},
  unitree:{x:0.48, y:0.85}
};

/* ── Init nodes with cluster-based positions ── */
const pm=new Map();
const baseW=1200, baseH=800;
P.forEach((p,i)=>{
  const c=clusterPos[p.t]||{x:0.5,y:0.5};
  const spread=120;
  const n={...p,
    x: c.x*baseW + (Math.random()-0.5)*spread,
    y: c.y*baseH + (Math.random()-0.5)*spread,
    vx:0, vy:0, r:8, visible:true};
  nodes.push(n); pm.set(p.id,n);
});
E.forEach(([a,b])=>{
  const na=pm.get(a),nb=pm.get(b);
  if(na&&nb) edges.push({source:na,target:nb});
});

/* ── Adjust radius: cited-by (in-degree) = bigger & bolder, cites-only = smaller & subdued ── */
nodes.forEach(n=>{
  n.inDeg=edges.filter(e=>e.target===n).length;   // cited by others
  n.outDeg=edges.filter(e=>e.source===n).length;   // cites others
  // Weight: heavy on in-degree, light on out-degree
  const score=n.inDeg*3 + n.outDeg*0.5;
  n.r=Math.max(5,Math.min(24,5+score*0.7));
});

/* ── Build adjacency for quick neighbor lookup ── */
const adjMap=new Map();
nodes.forEach(n=>adjMap.set(n,new Set()));
edges.forEach(e=>{adjMap.get(e.source).add(e.target);adjMap.get(e.target).add(e.source);});

/* ── Force simulation with topic clustering ── */
function tick(){
  if(alpha<0.0005&&!dragNode)return;
  alpha*=0.992;

  const vis=nodes.filter(n=>n.visible);
  const N=vis.length;
  // Adaptive parameters
  const repK=6000*alpha;
  const linkD=140;
  const linkK=0.008*alpha;
  const centerK=0.002*alpha;
  const clusterK=0.004*alpha; // pull same-topic nodes together
  const damp=0.82;

  // Repulsion (Barnes-Hut-like: skip very distant pairs)
  for(let i=0;i<N;i++){
    for(let j=i+1;j<N;j++){
      let dx=vis[j].x-vis[i].x, dy=vis[j].y-vis[i].y;
      let d2=dx*dx+dy*dy;
      if(d2>600*600) continue; // skip far pairs
      if(d2<1) d2=1;
      const d=Math.sqrt(d2);
      // Extra repulsion for same-topic (prevent overlap within cluster)
      const sameTopic=vis[i].t===vis[j].t;
      const k=sameTopic?repK*1.5:repK;
      const f=k/d2;
      const fx=dx/d*f, fy=dy/d*f;
      vis[i].vx-=fx; vis[i].vy-=fy;
      vis[j].vx+=fx; vis[j].vy+=fy;
    }
  }

  // Link attraction
  edges.forEach(e=>{
    if(!e.source.visible||!e.target.visible)return;
    let dx=e.target.x-e.source.x, dy=e.target.y-e.source.y;
    let d=Math.sqrt(dx*dx+dy*dy)||1;
    // Shorter rest length for same-topic links
    const rest=(e.source.t===e.target.t)?linkD*0.7:linkD;
    const f=(d-rest)*linkK;
    const fx=dx/d*f, fy=dy/d*f;
    e.source.vx+=fx; e.source.vy+=fy;
    e.target.vx-=fx; e.target.vy-=fy;
  });

  // Topic cluster gravity (pull toward cluster center)
  vis.forEach(n=>{
    const c=clusterPos[n.t];
    if(!c)return;
    const tx=c.x*baseW, ty=c.y*baseH;
    n.vx+=(tx-n.x)*clusterK;
    n.vy+=(ty-n.y)*clusterK;
  });

  // Global center gravity (weaker)
  const cx=baseW/2, cy=baseH/2;
  vis.forEach(n=>{
    n.vx+=(cx-n.x)*centerK*0.5;
    n.vy+=(cy-n.y)*centerK*0.5;
  });

  // Integrate
  vis.forEach(n=>{
    if(n===dragNode)return;
    n.vx*=damp; n.vy*=damp;
    n.x+=n.vx; n.y+=n.vy;
  });
}

/* ── Pre-simulate 400 ticks to settle layout before first render ── */
function preSimulate(){
  alpha=1.0;
  for(let i=0;i<400;i++) tick();
  alpha=0.05; // near-settled, gentle residual motion
  settled=true;
  // Auto-fit camera
  fitCamera();
}

function fitCamera(){
  const vis=nodes.filter(n=>n.visible);
  if(!vis.length)return;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  vis.forEach(n=>{
    minX=Math.min(minX,n.x-n.r-20);
    maxX=Math.max(maxX,n.x+n.r+20);
    minY=Math.min(minY,n.y-n.r-20);
    maxY=Math.max(maxY,n.y+n.r+20);
  });
  const gw=maxX-minX, gh=maxY-minY;
  const pad=60;
  camZ=Math.min((W-pad)/gw,(H-pad)/gh,1.5);
  camZ=Math.max(0.3,Math.min(camZ,1.2));
  camX=W/2-(minX+gw/2)*camZ;
  camY=H/2-(minY+gh/2)*camZ;
}

/* ── Draw ── */
function draw(){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#faf9f6';ctx.fillRect(0,0,W,H);
  ctx.translate(camX,camY);ctx.scale(camZ,camZ);

  const visEdges=edges.filter(e=>e.source.visible&&e.target.visible);
  const neighbors=new Set();
  const activeRef=hovNode||selNode;
  if(activeRef){
    adjMap.get(activeRef).forEach(nb=>neighbors.add(nb));
    neighbors.add(activeRef);
  }

  /* ── Edges: curved, color-coded by source topic ── */
  visEdges.forEach(e=>{
    const hi=activeRef&&(e.source===activeRef||e.target===activeRef);
    const dim=activeRef&&!hi;
    const dx=e.target.x-e.source.x, dy=e.target.y-e.source.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;

    // Subtle curve for readability
    const nx=-dy/d, ny=dx/d;
    const curveAmt=d*0.08;
    const cpx=(e.source.x+e.target.x)/2+nx*curveAmt;
    const cpy=(e.source.y+e.target.y)/2+ny*curveAmt;

    // Edge color from source topic (faded)
    const srcCol=TC[e.source.t]||'#9ca3af';
    ctx.beginPath();
    ctx.moveTo(e.source.x,e.source.y);
    ctx.quadraticCurveTo(cpx,cpy,e.target.x,e.target.y);
    if(hi){
      ctx.strokeStyle=srcCol;
      ctx.globalAlpha=0.8;
      ctx.lineWidth=2.5;
    } else {
      ctx.strokeStyle=dim?'rgba(200,200,200,0.15)':srcCol;
      ctx.globalAlpha=dim?0.15:0.2;
      ctx.lineWidth=1;
    }
    ctx.stroke();

    // Arrow at ~70% along curve
    if(hi||!dim){
      const t=0.7;
      const ax2=(1-t)*(1-t)*e.source.x+2*(1-t)*t*cpx+t*t*e.target.x;
      const ay2=(1-t)*(1-t)*e.source.y+2*(1-t)*t*cpy+t*t*e.target.y;
      const t2=t+0.01;
      const bx=((1-t2)*(1-t2)*e.source.x+2*(1-t2)*t2*cpx+t2*t2*e.target.x);
      const by=((1-t2)*(1-t2)*e.source.y+2*(1-t2)*t2*cpy+t2*t2*e.target.y);
      const adx=bx-ax2,ady=by-ay2;
      const ad=Math.sqrt(adx*adx+ady*ady)||1;
      const ux=adx/ad,uy=ady/ad;
      const sz=hi?6:4;
      ctx.beginPath();
      ctx.moveTo(ax2+ux*sz-uy*sz*0.5, ay2+uy*sz+ux*sz*0.5);
      ctx.lineTo(ax2+ux*sz+uy*sz*0.5, ay2+uy*sz-ux*sz*0.5);
      ctx.lineTo(ax2-ux*sz*0.3, ay2-uy*sz*0.3);
      ctx.closePath();
      ctx.fillStyle=hi?srcCol:'rgba(150,150,150,0.3)';
      ctx.globalAlpha=hi?0.8:0.25;
      ctx.fill();
    }
    ctx.globalAlpha=1;
  });

  /* ── Nodes ── */
  const vis=nodes.filter(n=>n.visible);
  vis.forEach(n=>{
    const col=TC[n.t]||'#78716c';
    const dim=activeRef&&!neighbors.has(n);
    ctx.globalAlpha=dim?0.18:1;

    // Shadow for prominent nodes (high in-degree)
    if(n.inDeg>=2&&!dim){
      ctx.beginPath();ctx.arc(n.x+1.5,n.y+1.5,n.r,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fill();
    }

    // Circle fill — driven by in-degree
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    if(n.inDeg===0){
      // Cite-only nodes: light fill with dashed border
      ctx.fillStyle=col+'18';ctx.fill();
      ctx.setLineDash([3,2.5]);
      ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.stroke();
      ctx.setLineDash([]);
    } else if(n.inDeg<=2){
      // Moderately cited: solid fill, thinner border
      ctx.fillStyle=col+'90';ctx.fill();
      ctx.strokeStyle=n===selNode?'#1c1917':'rgba(255,255,255,0.7)';
      ctx.lineWidth=n===selNode?3:1.4;
      ctx.stroke();
    } else {
      // Heavily cited (3+): bold solid fill, prominent border
      ctx.fillStyle=col;ctx.fill();
      ctx.strokeStyle=n===selNode?'#1c1917':'rgba(255,255,255,0.9)';
      ctx.lineWidth=n===selNode?3:2;
      ctx.stroke();
    }

    // Label — size and weight scale with in-degree
    const fontSize=n.inDeg===0?
      Math.max(7,Math.min(10,n.r*0.8)):
      Math.max(9,Math.min(13,n.r*0.95));
    const fontWeight=n.inDeg>=2?'600 ':'';
    ctx.fillStyle=dim?'rgba(87,83,78,0.2)':
      n===activeRef?'#1c1917':
      n.inDeg===0?col:'#44403c';
    ctx.font=`${fontWeight}${fontSize}px "JetBrains Mono",monospace`;
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(n.s,n.x,n.y+n.r+3);
    ctx.globalAlpha=1;
  });

  ctx.restore();
}

function loop(){tick();draw();requestAnimationFrame(loop);}

/* ── Interaction ── */
function screenToWorld(sx,sy){return{x:(sx-camX)/camZ,y:(sy-camY)/camZ};}
function nodeAt(wx,wy){
  const vis=nodes.filter(n=>n.visible);
  for(let i=vis.length-1;i>=0;i--){
    const n=vis[i],dx=n.x-wx,dy=n.y-wy;
    if(dx*dx+dy*dy<(n.r+5)*(n.r+5))return n;
  }return null;
}

let panStart=null;
cv.addEventListener('mousemove',e=>{
  const rect=cv.getBoundingClientRect();
  const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
  // Panning
  if(panStart&&!dragNode){
    camX=e.clientX-panStart.x;camY=e.clientY-panStart.y;
    return;
  }
  if(dragNode){
    const w=screenToWorld(sx,sy);
    dragNode.x=w.x;dragNode.y=w.y;dragNode.vx=0;dragNode.vy=0;
    return;
  }
  const w=screenToWorld(sx,sy);
  const n=nodeAt(w.x,w.y);
  hovNode=n;cv.style.cursor=n?'pointer':'grab';
  if(n){
    tip.style.display='block';
    tip.style.left=Math.min(sx+14,W-300)+'px';
    tip.style.top=Math.min(sy+14,H-80)+'px';
    const col=TC[n.t]||'#78716c';
    const fTag=n.inDeg>=3?`<span style="opacity:0.6"> · 被引${n.inDeg}次</span>`:n.inDeg>0?`<span style="opacity:0.6"> · 被引${n.inDeg}次</span>`:'';
    tip.innerHTML=`<div class="tt-title" style="color:${col}">${n.s}</div><div class="tt-authors">${n.o}</div><div class="tt-meta">${n.a} · ${n.y} | ${TN[n.t]||''}${fTag}</div>`;
  }else{tip.style.display='none';}
});

cv.addEventListener('mousedown',e=>{
  const rect=cv.getBoundingClientRect();
  const w=screenToWorld(e.clientX-rect.left,e.clientY-rect.top);
  const n=nodeAt(w.x,w.y);
  if(n){dragNode=n;cv.style.cursor='grabbing';alpha=Math.max(alpha,0.15);}
  else{dragNode=null;panStart={x:e.clientX-camX,y:e.clientY-camY};}
});
cv.addEventListener('mouseup',e=>{
  if(dragNode){
    const rect=cv.getBoundingClientRect();
    const w=screenToWorld(e.clientX-rect.left,e.clientY-rect.top);
    const n=nodeAt(w.x,w.y);
    if(n===dragNode)showDetail(dragNode);
  }
  dragNode=null;panStart=null;
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=cv.getBoundingClientRect();
  const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
  const oldZ=camZ;
  camZ*=e.deltaY<0?1.12:0.88;
  camZ=Math.max(0.15,Math.min(5,camZ));
  camX=sx-(sx-camX)*camZ/oldZ;
  camY=sy-(sy-camY)*camZ/oldZ;
},{passive:false});
cv.addEventListener('mouseleave',()=>{hovNode=null;tip.style.display='none';});
cv.addEventListener('dblclick',()=>{fitCamera();});

/* ── Detail panel ── */
function showDetail(n){
  selNode=n;
  const refs=edges.filter(e=>e.source===n).map(e=>e.target);
  const citedBy=edges.filter(e=>e.target===n).map(e=>e.source);
  const col=TC[n.t]||'#78716c';
  const topicLabel=TN[n.t]||'';
  const kindLabel=n.inDeg>=3?` · 高引用(${n.inDeg})`:n.inDeg>0?` · 被引${n.inDeg}`:'';
  const badge=`<span class="d-badge" style="background:${col};color:#fff">${topicLabel}${kindLabel}</span>`;
  // Resolve paper link: numeric id → arXiv, l field → arXiv, gen0 → blog
  let linkUrl='', linkText='';
  if(n.id.match(/^\d/)){
    linkUrl=`https://arxiv.org/abs/${n.id}`;
    linkText=`arXiv ${n.id}`;
  } else if(n.l){
    linkUrl=`https://arxiv.org/abs/${n.l}`;
    linkText=`arXiv ${n.l}`;
  } else if(n.id==='gen0'){
    linkUrl='https://generalistai.com/blog';
    linkText='Generalist AI Blog';
  }
  let html=badge+`<div class="d-title">${n.s}</div>
    <div class="d-authors" style="font-weight:600;color:var(--text)">${n.o}</div>
    <div class="d-authors">${n.a} · ${n.y}</div>`;
  if(linkUrl) html+=`<div class="d-inst" style="margin-bottom:6px"><a href="${linkUrl}" target="_blank" style="color:${col};text-decoration:none;font-family:var(--font-mono);font-size:0.72rem">${linkText} ↗</a></div>`;
  html+=`<div class="d-desc">${n.d}</div>`;
  if(refs.length){
    html+=`<div class="d-connections"><h4>References (${refs.length})</h4>`;
    refs.sort((a,b)=>a.t.localeCompare(b.t)||a.y-b.y);
    refs.forEach(r=>{
      const rc=TC[r.t]||'#78716c';
      html+=`<div class="d-conn-item" onclick="jumpTo('${r.id}')" style="border-left:3px solid ${rc};padding-left:8px">${r.inDeg>=3?'★':r.inDeg>0?'●':'○'} ${r.s} <span style="color:#78716c">${r.y}</span></div>`;
    });
    html+=`</div>`;
  }
  if(citedBy.length){
    html+=`<div class="d-connections"><h4>Cited By (${citedBy.length})</h4>`;
    citedBy.sort((a,b)=>a.t.localeCompare(b.t)||a.y-b.y);
    citedBy.forEach(r=>{
      const rc=TC[r.t]||'#78716c';
      html+=`<div class="d-conn-item" onclick="jumpTo('${r.id}')" style="border-left:3px solid ${rc};padding-left:8px">${r.inDeg>=3?'★':r.inDeg>0?'●':'○'} ${r.s} <span style="color:#78716c">${r.y}</span></div>`;
    });
    html+=`</div>`;
  }
  if(linkUrl) html+=`<a class="d-link" href="${linkUrl}" target="_blank" style="color:${col};border-color:${col}">查看论文 &rarr;</a>`;
  detC.innerHTML=html;
  det.classList.add('open');
}
function closeDetail(){det.classList.remove('open');selNode=null;}
function jumpTo(id){
  const n=pm.get(id);if(!n||!n.visible)return;
  selNode=n;showDetail(n);
  // Smooth camera to node
  const tx=W/2-n.x*camZ, ty=H/2-n.y*camZ;
  camX+=(tx-camX)*0.8; camY+=(ty-camY)*0.8;
}

/* ── Filter ── */
document.querySelectorAll('.topic-pill').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.topic-pill').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filterT=btn.dataset.t;applyFilter();
  });
});
document.getElementById('searchInput').addEventListener('input',e=>{
  searchQ=e.target.value.toLowerCase();applyFilter();
});
function applyFilter(){
  nodes.forEach(n=>{
    let show;
    if(filterT==='all'){
      show=true;
    } else if(filterT==='foundation'){
      show=!!n.f;
    } else {
      // Show topic match (both survey and foundation)
      show=n.t===filterT;
      // Also show connected cross-topic papers that are cited by this topic
      if(!show){
        show=edges.some(e=>
          (e.source===n&&e.target.t===filterT)||
          (e.target===n&&e.source.t===filterT)
        );
      }
    }
    if(searchQ&&show) show=n.s.toLowerCase().includes(searchQ)||n.id.includes(searchQ)||n.d.toLowerCase().includes(searchQ);
    n.visible=show;
  });
  if(selNode&&!selNode.visible)closeDetail();
  alpha=Math.max(alpha,0.3);
  setTimeout(fitCamera,300);
}

/* ── Expose functions used in HTML onclick handlers ── */
window.closeDetail=closeDetail;
window.jumpTo=jumpTo;

/* ── Boot: resize → pre-simulate → start render loop ── */
resize();
preSimulate();
loop();
});
</script>
<script src="render.js"></script>
